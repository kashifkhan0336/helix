name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
  
    runs-on: ubuntu-22.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --profile opt --config 'build.rustflags="-C target-cpu=native"' --locked
    - name: Run tests
      run: cargo test --verbose
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
    # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
        name: helix # optional, default is artifact
    # A file, directory or wildcard pattern that describes what to upload.
        path: |
          target/opt/hx
          runtime/

