name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
  
    runs-on: ubuntu-22.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --profile opt --config 'build.rustflags="-C target-cpu=native"' --locked
    - name: Run tests
      run: cargo test --verbose
